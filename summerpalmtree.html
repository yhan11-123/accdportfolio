<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Palm Tree</title>
    <link rel="stylesheet" href="css/summerpalmtree.css">
</head>
<body>

<div class="spt-page">

  <div class="spt-section spt-hero">
    <div class="spt-hero-title spt-hero-title--regular">SUMMER PALM TREE</div>
    <div class="spt-hero-title spt-hero-title--bold">SUMMER PALM TREE</div>
    <div class="spt-hero-meta spt-hero-meta--font-design">Font Design</div>
    <div class="spt-hero-meta spt-hero-meta--credit">Younhee Han </div>
    <div class="spt-hero-meta spt-hero-meta--reverse">Reverse - Contrast</div>
    <div class="spt-hero-meta spt-hero-meta--packaging">+ Packaging Desing</div>
  </div>

  <div class="spt-section spt-sunset">
    <div class="spt-sunset-text">
      <span class="spt-font-regular">SU</span><span class="spt-font-bold">N</span><span class="spt-font-regular">SET<br/>BREE</span><span class="spt-font-bold">Z</span><span class="spt-font-regular">E<br/>I</span><span class="spt-font-bold">S</span><span class="spt-font-regular">LAND</span>
    </div>
  </div>

  <div class="spt-section spt-palmtree">
    <div class="spt-palmtree-header">
      <div class="spt-palmtree-header-text">Beneath The Palm Tree</div>
    </div>
    <div class="spt-palmtree-box spt-palmtree-box--blue">
      <div class="spt-palmtree-box-text">GOLDEN<br/>SUMMER<br/>RITUAL</div>
    </div>
    <div class="spt-palmtree-box spt-palmtree-box--orange">
      <div class="spt-palmtree-box-text">Tropical<br/>Midnight<br/>Hour</div>
    </div>
  </div>

  <div class="spt-section spt-alphabet--light">
    <div class="spt-alphabet-text">ABCDEFGHI    JKLMNOPQR    STUVWX</div>
  </div>

  <div class="spt-section spt-alphabet--dark">
    <div class="spt-alphabet-text">ABCDEFGHI    JKLMNOPQR    STUVWX</div>
  </div>

  <div class="spt-section spt-numbers">
    <div class="spt-numbers-text">1234567890<br/>,.;:''""()[]<br/>/\!?*%</div>
  </div>

  <img class="spt-img" src="assets/images/fdpack.pdf" alt="fontdesignmockup" />
  
</div>

</body>
</html>
